<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>PasswortPeter</title>

<!-- Diese Zeile ist der Beweis, nicht das Versprechen.
     connect-src 'none' verbietet dem Browser jeden Netzzugriff aus dieser Datei
     heraus. Selbst wenn im Code unten ein Fehler steckte, könnte nichts hinaus.
     'unsafe-eval' und 'wasm-unsafe-eval' braucht libsodium für sein WebAssembly.
     Falls die Datei in einem Browser gar nicht startet: diese eine Zeile
     entfernen und melden. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">

<style>
/* @@CSS@@ */
</style>
</head>
<body data-druck-hinweis="PasswortPeter druckt keine Tresore.">

<!-- Ladeschirm, bis libsodium sein WebAssembly gestartet hat -->
<section id="laedt" class="schirm schirm--mitte">
  <div class="tafel tafel--schmal">
    <div class="marke"><span class="marke__logo" aria-hidden="true"></span><span class="marke__name">PasswortPeter</span></div>
    <div class="riegel"><div class="riegel__lauf"></div></div>
    <p class="leise" data-t="laden.startet">Startet …</p>
    <noscript>
      <div class="warnung">Ohne JavaScript geht hier nichts. Die ganze Verschlüsselung läuft im Browser.</div>
    </noscript>
  </div>
</section>

<!-- Start -->
<section id="s-start" class="schirm schirm--mitte versteckt">
  <div class="tafel">
    <div class="tafel__kopf">
      <div class="marke"><span class="marke__logo" aria-hidden="true"></span><span class="marke__name">PasswortPeter</span></div>
      <div id="start-sprache" class="sprachwahl" role="group" data-t-aria="start.sprache" aria-label="Sprache"></div>
    </div>
    <h1 class="tafel__titel" data-t="start.titel">Deine Websites und Passwörter. In einer Datei.</h1>
    <p class="tafel__unter" data-t="start.unter"></p>

    <div id="ablage" class="ablage" role="button" tabindex="0">
      <span class="ablage__symbol" aria-hidden="true"></span>
      <strong data-t="start.ablage">Tresordatei hierher ziehen</strong>
      <span class="ablage__unter" data-t="start.ablageUnter">oder klicken zum Auswählen</span>
    </div>
    <input id="b-datei" type="file" accept=".peter,application/octet-stream" class="nur-lesen" tabindex="-1">

    <button id="b-neuer-tresor" class="knopf knopf--weit" data-t="start.neu">Neuen Tresor anlegen</button>

    <div id="start-fehler" class="warnung versteckt" role="alert"></div>

    <ul class="fakten">
      <li data-t="start.fakt1">Läuft komplett offline</li>
      <li data-t="start.fakt2">Argon2id + XChaCha20-Poly1305</li>
      <li data-t="start.fakt3">Kein Server, kein Konto</li>
    </ul>
    <p class="tafel__fuss" data-t="start.fuss"></p>
    <p class="tafel__version" id="start-version"></p>
  </div>
</section>

<!-- Neuer Tresor -->
<section id="s-neu" class="schirm schirm--mitte versteckt">
  <div id="neu-mitte" class="tafel"></div>
</section>

<!-- Aufsperren -->
<section id="s-auf" class="schirm schirm--mitte versteckt">
  <div id="auf-mitte" class="tafel tafel--schmal"></div>
</section>

<!-- Der Tresor -->
<section id="s-app" class="raum versteckt">
  <aside id="seite" class="seite" data-t-aria="leiste.navigation" aria-label="Navigation">
    <div class="seite__kopf">
      <div id="leiste-siegel-halter" class="seite__siegel"></div>
      <div class="seite__titel">
        <span id="leiste-name" class="seite__name"></span>
        <span id="leiste-status" class="seite__status"></span>
      </div>
    </div>
    <nav id="nav" class="nav"></nav>
  </aside>
  <div id="nav-schleier" class="schleier versteckt"></div>

  <div class="haupt">
    <header class="leiste">
      <button id="b-nav" class="symbolknopf nur-mobil" data-t-aria="leiste.navigation" aria-label="Navigation"></button>
      <div class="suche">
        <span class="suche__symbol" aria-hidden="true"></span>
        <input id="suche" class="suche__feld" type="search" autocomplete="off" spellcheck="false" data-t-ph="leiste.suche" data-t-aria="leiste.sucheLabel" placeholder="Suchen …" aria-label="Tresor durchsuchen">
        <kbd class="suche__kbd nur-breit" data-t="leiste.sucheHinweis">/ oder Strg+K</kbd>
      </div>
      <div class="leiste__tun">
        <button id="b-speichern" class="knopf knopf--haupt knopf--klein"><span class="knopf__punkt" aria-hidden="true"></span><span id="b-speichern-text" data-t="leiste.speichern">Speichern</span></button>
        <button id="b-sperren" class="symbolknopf" data-t-title="leiste.sperren" data-t-aria="leiste.sperren" title="Zusperren" aria-label="Zusperren"></button>
        <button id="b-menue" class="symbolknopf" data-t-title="leiste.menue" data-t-aria="leiste.menue" title="Menü" aria-label="Menü"></button>
      </div>
    </header>
    <div id="banner-halter" class="banner-halter"></div>
    <main id="inhalt" class="inhalt"></main>
  </div>

  <div id="auswahl-leiste" class="auswahl-leiste versteckt" role="toolbar"></div>
  <button id="b-neu-eintrag" class="plus"><span class="plus__symbol" aria-hidden="true"></span><span class="plus__text" data-t="leiste.neueKarte">Neue Karte</span></button>
</section>

<div id="vorhang-halter"></div>
<div id="zuruf-halter"></div>
<div id="druck-halter" aria-hidden="true"></div>

<script>

</script>
<script>

<script>

<script>

<script>

</script>
<script>

</script>
</body>
</html>
